<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Case File - a clear, focused place for keeping track of important details.">
    <title>Case File</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #10131a;
            color: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: radial-gradient(circle at top, #26344d, #10131a 60%);
        }

        main {
            width: min(100%, 42rem);
            padding: clamp(2rem, 7vw, 4rem);
            border: 1px solid #3c4c68;
            border-radius: 1rem;
            background: #171d29;
            box-shadow: 0 1.5rem 4rem #0006;
        }

        .eyebrow {
            margin: 0 0 0.75rem;
            color: #8db8ff;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            line-height: 1;
        }

        p {
            margin: 1.5rem 0 0;
            color: #c0cadb;
            font-size: 1.15rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Organize the details</p>
        <h1>Case File</h1>
        <p>A clear, focused place to collect the facts, notes, and next steps that matter.</p>
    </main>
</body>
</html>
